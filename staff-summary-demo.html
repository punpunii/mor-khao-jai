const cases={
1:{label:['เคส 1 · เจ็บหน้าอก','Case 1 · Chest Pain'],rows:[['อาการหลัก','แน่นกลางหน้าอกเป็น ๆ หาย ๆ ตั้งแต่ช่วงเช้า','Main symptom','Intermittent central chest tightness since this morning'],['อาการร่วม','เหนื่อยเล็กน้อย และกลับมาเมื่อเดินเร็ว','Associated symptoms','Mild shortness of breath that returns when walking quickly'],['ระยะเวลา','ประมาณ 3 ชั่วโมง','Duration','About 3 hours'],['สิ่งที่ควรรู้','มีข้อจำกัดด้านการได้ยิน ต้องการให้หันหน้าเข้าหาและพูดชัด หากไม่เข้าใจให้เขียนหรือพิมพ์','Communication needs','Has hearing difficulty. Please face the patient and speak clearly; use writing or typing if needed.']]},
2:{label:['เคส 2 · ปวดศีรษะ','Case 2 · Headache'],rows:[['อาการหลัก','ปวดศีรษะตั้งแต่เมื่อวาน และวันนี้ปวดมากขึ้น','Main symptom','Headache since yesterday, worse today'],['อาการร่วม','ไวต่อแสงเล็กน้อย ไม่มีไข้ ไม่มีอาเจียน','Associated symptoms','Mild light sensitivity; no fever or vomiting'],['ระยะเวลา','ประมาณ 1 วัน','Duration','About 1 day'],['สิ่งที่ควรรู้','อ่านปากได้ดีเมื่อเห็นใบหน้าชัด แต่บริเวณรอมีคนพูดหลายคนพร้อมกัน','Communication needs','Lip-reading works well when the face is visible, but the waiting area has several people speaking at once.']]},
3:{label:['เคส 3 · เวียนศีรษะ','Case 3 · Dizziness'],rows:[['อาการหลัก','เวียนศีรษะและโคลงเคลงหลังลุกจากเก้าอี้','Main symptom','Dizziness and unsteadiness after standing up from a chair'],['อาการร่วม','ยังไม่มั่นคงขณะยืน ไม่มีเจ็บหน้าอก','Associated symptoms','Still unsteady while standing; no chest pain'],['ระยะเวลา','เริ่มประมาณ 20 นาทีก่อนมาถึง','Duration','Started about 20 minutes before arrival'],['สิ่งที่ควรรู้','ขอให้พูดช้าลง และพิมพ์ข้อมูลสำคัญให้ดู','Communication needs','Asks staff to speak slowly and type important information.']]},
4:{label:['เคส 4 · ปวดท้อง','Case 4 · Abdominal Pain'],rows:[['อาการหลัก','ปวดท้องด้านขวาล่างตั้งแต่เมื่อคืน','Main symptom','Right lower abdominal pain since last night'],['อาการร่วม','คลื่นไส้เล็กน้อย เบื่ออาหาร และปวดมากขึ้นเวลาเดิน','Associated symptoms','Mild nausea, loss of appetite, and more pain when walking'],['ระยะเวลา','ประมาณ 10 ชั่วโมง','Duration','About 10 hours'],['สิ่งที่ควรรู้','ใช้เครื่องช่วยฟัง แต่เสียงรอบข้างทำให้ฟังคำถามยาก ต้องการบริเวณที่เงียบ','Communication needs','Uses a hearing aid, but background noise makes questions difficult to hear; a quieter area is preferred.']]},
5:{label:['เคส 5 · ไข้และไอ','Case 5 · Fever and Cough'],rows:[['อาการหลัก','มีไข้และไอตั้งแต่เมื่อคืน','Main symptom','Fever and cough since last night'],['อาการร่วม','เจ็บคอเล็กน้อย อ่อนเพลีย และยังไม่มีข้อมูลว่าหอบเหนื่อย','Associated symptoms','Mild sore throat and fatigue; no information yet about shortness of breath'],['ระยะเวลา','ประมาณ 18 ชั่วโมง','Duration','About 18 hours'],['สิ่งที่ควรรู้','มีข้อจำกัดด้านการได้ยินและใช้การอ่านปากเป็นหลัก หน้ากากทำให้อ่านปากได้ยาก','Communication needs','Has hearing difficulty and relies mainly on lip-reading; a mask makes lip-reading difficult.']]}
};
const qs={
1:{q:['จากข้อมูลทั้งหมด ข้อใดควรทำเป็นลำดับแรก?','Based on all the information, what should be done first?'],a:[
['ให้ผู้ป่วยกรอกข้อมูลอาการให้ครบก่อน แล้วค่อยแจ้งทีมที่เกี่ยวข้อง','Ask the patient to complete all symptom information before notifying the relevant team.',0,['ข้อมูลเพิ่มเติมมีประโยชน์ แต่แน่นหน้าอกร่วมกับเหนื่อยและเป็นมากขึ้นเมื่อออกแรงไม่ควรทำให้การประเมินล่าช้า','Additional information can help, but chest tightness with shortness of breath that returns with exertion should not delay assessment.']],
['แจ้งทีมให้ประเมินอาการโดยเร็ว พร้อมจัดวิธีสื่อสารที่ผู้ป่วยเข้าใจได้ระหว่างการประเมิน','Notify the team for prompt assessment while using a communication method the patient can understand.',1,['ถูกต้องค่ะ เพราะอาการเจ็บหน้าอกร่วมกับเหนื่อยควรได้รับการประเมินอย่างเหมาะสมโดยเร็ว และข้อจำกัดด้านการได้ยินไม่ควรเป็นอุปสรรคต่อการรับข้อมูล','Correct. Chest pain with shortness of breath warrants prompt assessment, and hearing difficulty should not prevent the patient from receiving or giving important information.']],
['พาผู้ป่วยไปนั่งพักในพื้นที่เงียบก่อน แล้วค่อยประเมินเมื่ออาการสงบ','Move the patient to a quiet area first and assess after the symptoms settle.',0,['การจัดพื้นที่ช่วยเรื่องการสื่อสารได้ แต่ไม่ควรใช้เป็นเหตุให้เลื่อนการประเมินอาการที่อาจเร่งด่วน','A quieter area can help communication, but it should not delay assessment of potentially urgent symptoms.']],
['ให้ผู้ติดตามเป็นผู้ตอบคำถามทั้งหมดแทน เพื่อให้ซักประวัติได้เร็วขึ้น','Have the accompanying person answer all questions instead to speed up history taking.',0,['ผู้ติดตามช่วยได้ แต่ควรสื่อสารกับผู้ป่วยโดยตรงและให้ผู้ป่วยมีส่วนร่วมเท่าที่ทำได้','An accompanying person may help, but staff should communicate directly with the patient and involve them as much as possible.']]]},
2:{q:['ข้อใดเหมาะที่สุดสำหรับการเริ่มซักถามผู้ป่วยรายนี้?','Which approach is most appropriate when starting the assessment?'],a:[
['ลดแสงให้มืดที่สุดและให้ผู้ป่วยหลับตาระหว่างตอบคำถาม','Make the room as dark as possible and ask the patient to close their eyes while answering.',0,['ความไวต่อแสงไม่ได้หมายความว่าต้องทำให้มืดจนผู้ป่วยมองใบหน้าไม่ได้ เพราะผู้ป่วยใช้การอ่านปากช่วยเข้าใจคำพูด','Light sensitivity does not mean the room should be dark enough to prevent the patient from seeing the face, especially when they rely on lip-reading.']],
['ให้ญาติหรือเจ้าหน้าที่อีกคนพูดแทน เพื่อไม่ให้ผู้ป่วยต้องอ่านปาก','Ask a relative or another staff member to speak instead so the patient does not need to lip-read.',0,['ไม่ควรเปลี่ยนผู้สื่อสารแทนผู้ป่วยโดยอัตโนมัติ และการเพิ่มผู้พูดอาจทำให้สับสนมากขึ้น','Do not automatically replace the patient’s preferred communication method, and adding another speaker may increase confusion.']],
['พูดเร็วขึ้นเล็กน้อยเพื่อให้ใช้เวลาซักถามน้อยลง','Speak slightly faster to reduce the time needed for questions.',0,['การพูดเร็วขึ้นไม่ได้ช่วยให้ผู้ที่พึ่งการอ่านปากเข้าใจง่ายขึ้น และอาจทำให้ข้อมูลตกหล่น','Speaking faster does not make lip-reading easier and may cause information to be missed.']],
['ย้ายไปจุดที่มีสิ่งรบกวนน้อย ให้ผู้ป่วยเห็นใบหน้าชัด และถามทีละประเด็น','Move to a less distracting area, keep the face clearly visible, and ask one point at a time.',1,['ถูกต้องค่ะ เพราะวิธีนี้แก้ทั้งสภาพแวดล้อมและช่องทางการรับข้อมูล โดยไม่ตัดผู้ป่วยออกจากการสื่อสาร','Correct. This addresses both the environment and the patient’s way of receiving information without excluding them from the conversation.']]]},
3:{q:['ผู้ป่วยยังไม่มั่นคงขณะยืนและขอให้พูดช้าพร้อมพิมพ์ข้อมูลสำคัญ ข้อใดเหมาะที่สุด?','The patient is still unsteady and asks staff to speak slowly and type important information. What is most appropriate?'],a:[
['ให้ผู้ป่วยนั่งหรืออยู่ในตำแหน่งที่ปลอดภัยก่อน แล้วประเมินอาการต่อพร้อมใช้วิธีสื่อสารที่ผู้ป่วยเข้าใจ','Help the patient sit or remain in a safe position, then continue assessment using a communication method they understand.',1,['ถูกต้องค่ะ เมื่อผู้ป่วยยังโคลงเคลงควรคำนึงถึงความปลอดภัยก่อน และสามารถใช้การพูดช้าร่วมกับการพิมพ์ตามความต้องการของผู้ป่วย','Correct. Safety comes first while the patient is still unsteady, and slow speech can be combined with typing as requested.']],
['ให้ผู้ป่วยยืนต่อเพื่อดูว่าอาการจะหายเองหรือไม่','Ask the patient to keep standing to see whether the symptoms go away.',0,['การให้ยืนต่อโดยไม่จำเป็นเพิ่มความเสี่ยงต่อการล้ม ในขณะที่ผู้ป่วยยังไม่มั่นคง','Keeping an unsteady patient standing unnecessarily may increase the risk of a fall.']],
['ให้เจ้าหน้าที่จับตัวไว้แล้วซักถามผู้ติดตามแทน','Have staff hold the patient and ask the accompanying person instead.',0,['การช่วยพยุงอาจจำเป็นตามสถานการณ์ แต่ไม่ควรแทนผู้ป่วยในการสื่อสารโดยอัตโนมัติ','Physical support may be needed depending on the situation, but it should not automatically replace communication with the patient.']],
['เปลี่ยนเป็นพิมพ์ทุกอย่างแทนการพูดทันที','Switch immediately to typing everything instead of speaking.',0,['การพิมพ์เป็นตัวช่วยที่ดี แต่ไม่จำเป็นต้องตัดการพูดทั้งหมด หากผู้ป่วยยังเข้าใจการพูดร่วมกับการพิมพ์ได้','Typing is useful, but there is no need to stop speaking completely if the patient can understand speech together with typing.']]]},
4:{q:['จากข้อมูลนี้ ข้อใดเป็นแนวทางที่เหมาะที่สุดในการเริ่มดูแล?','Based on this information, what is the most appropriate approach to begin care?'],a:[
['ให้รอจนกว่าจะมีไข้จึงค่อยพิจารณาว่าต้องประเมินเพิ่มเติมหรือไม่','Wait until fever develops before deciding whether further assessment is needed.',0,['อาการปวดท้องด้านขวาล่างที่เป็นต่อเนื่องและมากขึ้นเมื่อเคลื่อนไหวควรได้รับการประเมิน ไม่จำเป็นต้องรอให้มีไข้ก่อน','Persistent right lower abdominal pain that worsens with movement should be assessed; fever does not need to appear first.']],
['ให้ผู้ป่วยเดินไปมาเพื่อดูว่าอาการปวดเปลี่ยนแปลงหรือไม่','Ask the patient to walk around to see whether the pain changes.',0,['ไม่จำเป็นต้องให้ผู้ป่วยทำกิจกรรมที่เพิ่มอาการปวดเพื่อเก็บข้อมูล เพราะสามารถซักประวัติและประเมินตามขั้นตอนได้','The patient does not need to perform an activity that increases pain just to gather information; history and assessment can be done safely.']],
['จัดพื้นที่ที่เงียบขึ้นเพื่อเก็บข้อมูลอาการให้ครบ และส่งต่อเพื่อประเมินตามความเหมาะสมโดยไม่วินิจฉัยเอง','Move to a quieter area to gather the symptom information clearly, then refer for appropriate assessment without making a diagnosis.',1,['ถูกต้องค่ะ อาการลักษณะนี้มีสาเหตุได้หลายอย่าง จึงควรเก็บข้อมูลและให้บุคลากรที่เกี่ยวข้องประเมินต่อ พร้อมลดเสียงรบกวนเพื่อไม่ให้ข้อมูลตกหล่น','Correct. Symptoms like these can have several causes, so the information should be gathered and assessed appropriately without assuming a diagnosis; reducing background noise also helps prevent missed information.']],
['สรุปทันทีว่าเป็นไส้ติ่งอักเสบและเตรียมการรักษาเฉพาะโรค','Immediately conclude that it is appendicitis and prepare disease-specific treatment.',0,['อาการปวดท้องขวาล่างพบได้ในไส้ติ่งอักเสบ แต่ข้อมูลเท่านี้ยังไม่ควรใช้วินิจฉัยโรคหรือกำหนดการรักษาเอง','Right lower abdominal pain can occur with appendicitis, but this information alone is not enough to diagnose or decide treatment.']]]},
5:{q:['ผู้ป่วยใช้การอ่านปากเป็นหลักและกำลังสวมหน้ากาก ข้อใดเหมาะที่สุดระหว่างการประเมิน?','The patient mainly relies on lip-reading and is wearing a mask. What is most appropriate during assessment?'],a:[
['ให้ผู้ติดตามเป็นผู้สื่อสารหลักแทนผู้ป่วยตลอดการซักถาม','Have the accompanying person communicate on the patient’s behalf throughout the assessment.',0,['ผู้ติดตามช่วยได้ แต่ไม่ควรแทนผู้ป่วยโดยอัตโนมัติ ควรพยายามสื่อสารกับผู้ป่วยโดยตรงด้วยวิธีที่เหมาะสม','An accompanying person may help, but should not automatically replace the patient. Staff should communicate directly using an appropriate method.']],
['หันหน้าเข้าหาผู้ป่วย พูดชัดเจน และใช้การเขียนหรือพิมพ์เสริมเมื่ออ่านปากได้ยาก','Face the patient, speak clearly, and use writing or typing when lip-reading is difficult.',1,['ถูกต้องค่ะ เพราะผู้ป่วยใช้การอ่านปากเป็นหลัก หน้ากากอาจเป็นอุปสรรค จึงควรเพิ่มช่องทางอื่นโดยยังคำนึงถึงความปลอดภัย','Correct. Because the patient relies on lip-reading, a mask can create a barrier, so another communication method should be added while maintaining safety.']],
['ขอให้ผู้ป่วยถอดหน้ากากตลอดการพูดคุยเพื่อให้เห็นปากชัด','Ask the patient to remove their mask throughout the conversation so the mouth is visible.',0,['ไม่ควรสรุปว่าต้องถอดหน้ากากเสมอ เพราะต้องคำนึงถึงความปลอดภัยและมาตรการของสถานพยาบาล','Do not assume the mask should always be removed; safety and facility policies must also be considered.']],
['พูดให้ดังและเร็วขึ้นเพื่อให้ผู้ป่วยจับคำสำคัญได้','Speak louder and faster so the patient can catch the key words.',0,['การพูดเร็วขึ้นอาจทำให้เข้าใจยากกว่าเดิม และไม่ได้แก้ปัญหาที่ผู้ป่วยมองปากได้ไม่ชัด','Speaking faster may make understanding harder and does not solve the problem of not being able to see the mouth clearly.']]]}
};
let current=1;
let currentLang='th';
function t(v){return Array.isArray(v)?v[currentLang==='en'?1:0]:v;}
function renderCaseDetails(){
 const tabs=document.getElementById('caseTabs'); tabs.innerHTML='';
 Object.keys(cases).forEach(n=>{const b=document.createElement('button');b.className='case-tab'+(Number(n)===current?' active':'');b.dataset.case=n;b.textContent=t(cases[n].label);b.onclick=()=>render(Number(n));tabs.appendChild(b);});
 const details=document.getElementById('caseDetails'); details.innerHTML='';
 const c=cases[current]; const wrap=document.createElement('div'); wrap.className='case active';
 c.rows.forEach(row=>{const d=document.createElement('div');d.className='demo-row';d.innerHTML='<b>'+t([row[0],row[2]])+'</b><span>'+t([row[1],row[3]])+'</span>';wrap.appendChild(d);}); details.appendChild(wrap);
}
function render(n){current=n;renderCaseDetails();document.getElementById('qText').textContent=t(qs[n].q);const box=document.getElementById('answers');box.innerHTML='';document.getElementById('r').textContent='';document.getElementById('reason').textContent='';qs[n].a.forEach(([th,en,g,reason])=>{const b=document.createElement('button');b.textContent=t([th,en]);b.onclick=()=>{box.querySelectorAll('button').forEach(x=>{x.disabled=false;x.classList.remove('wrong','correct');});b.classList.add(g?'correct':'wrong');document.getElementById('r').textContent=g?'✓ '+(currentLang==='en'?'Correct':'ถูกต้องค่ะ'):'✦ '+(currentLang==='en'?'Not the best choice — try again.':'ยังไม่ใช่ตัวเลือกที่เหมาะที่สุด — ลองตอบใหม่ได้เลย');document.getElementById('reason').textContent=t(reason);if(g){box.querySelectorAll('button').forEach(x=>x.disabled=true);}};box.appendChild(b);});}
function applyPageLanguage(lang){currentLang=lang==='en'?'en':'th';document.title=currentLang==='en'?'Practice Reading a Patient Summary · MOR KHAO JAI':'ทดลองอ่านใบสรุปอาการ · หมอเข้าใจ';document.querySelectorAll('[data-th][data-en]').forEach(el=>{el.textContent=currentLang==='en'?el.dataset.en:el.dataset.th;});document.getElementById('staffTip').textContent=currentLang==='en'?'This practice focuses on prioritization and communication, not diagnosing a disease from this information alone.':'แบบฝึกนี้เน้นถึงการจัดลำดับความสำคัญและการสื่อสาร ไม่ใช่วินิจฉัยโรคจากเพียงข้อมูลเท่านี้';render(current);}
window.mkjAfterLanguageChange=applyPageLanguage;
render(1);
</script>
