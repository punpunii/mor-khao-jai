<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>คลังคำศัพท์สุขภาพ | หมอเข้าใจ</title>

<style>

:root{
    --cream:#FFFDF7;
    --cream-2:#F8F4E9;

    --sage:#7FBDAA;
    --sage-dark:#5D9C88;
    --sage-soft:#E8F4EF;

    --text:#45534D;
    --muted:#89958F;

    --white:#FFFFFF;

    --shadow:
        0 10px 30px rgba(70,90,80,.08);
}


/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:var(--cream);
    color:var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans Thai",
        sans-serif;
}


/* =========================
   BACK
========================= */

.back{
    display:inline-block;

    margin:
        24px
        28px
        0;

    color:var(--sage-dark);

    text-decoration:none;

    font-weight:700;
}


/* =========================
   CONTAINER
========================= */

.container{
    width:min(
        1100px,
        calc(100% - 36px)
    );

    margin:auto;
}


/* =========================
   HERO
========================= */

.hero{
    text-align:center;

    padding:
        55px
        20px
        30px;
}

.hero h1{
    margin:0;

    font-size:
        clamp(
            30px,
            5vw,
            46px
        );

    color:#55766B;
}

.hero p{
    margin:
        12px
        auto
        0;

    max-width:650px;

    color:var(--muted);

    line-height:1.7;
}


/* =========================
   SEARCH
========================= */

.search-box{
    margin:
        20px
        auto
        26px;

    max-width:650px;
}

.search-box input{
    width:100%;

    border:none;
    outline:none;

    background:#fff;

    border-radius:18px;

    padding:
        17px
        20px;

    font-size:16px;

    color:var(--text);

    box-shadow:var(--shadow);
}

.search-box input::placeholder{
    color:#A7B0AC;
}


/* =========================
   CATEGORY
========================= */

.categories{
    display:flex;

    flex-wrap:wrap;

    gap:9px;

    justify-content:center;

    margin-bottom:30px;
}

.category-btn{
    border:none;

    background:#fff;

    color:#688078;

    padding:
        10px
        16px;

    border-radius:999px;

    cursor:pointer;

    font-weight:700;

    box-shadow:
        0 5px 18px rgba(70,90,80,.06);

    transition:
        .2s ease;
}

.category-btn:hover{
    transform:
        translateY(-2px);
}

.category-btn.active{
    background:var(--sage);

    color:#fff;
}


/* =========================
   VOCAB GRID
========================= */

.vocab-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:16px;

    padding-bottom:50px;
}

.vocab-card{
    border:none;

    background:#fff;

    border-radius:22px;

    padding:
        22px
        18px;

    min-height:145px;

    text-align:left;

    cursor:pointer;

    box-shadow:var(--shadow);

    transition:
        .22s ease;
}

.vocab-card:hover{
    transform:
        translateY(-5px);

    box-shadow:
        0 15px 35px
        rgba(70,90,80,.13);
}

.vocab-icon{
    width:45px;
    height:45px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:var(--sage-soft);

    color:var(--sage-dark);

    font-size:23px;

    margin-bottom:15px;
}

.vocab-card h3{
    margin:
        0
        0
        6px;

    font-size:17px;

    color:#4E625A;
}

.vocab-card p{
    margin:0;

    font-size:13px;

    color:var(--muted);
}

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:
        60px
        20px;

    color:var(--muted);
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:
        rgba(
            49,
            64,
            58,
            .38
        );

    backdrop-filter:
        blur(8px);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:99999;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(
        760px,
        100%
    );

    max-height:92vh;

    overflow:auto;

    background:#fff;

    border-radius:26px;

    box-shadow:
        0 25px 70px
        rgba(30,50,42,.2);

    animation:
        modalIn .2s ease;
}

@keyframes modalIn{

    from{
        opacity:0;

        transform:
            scale(.96)
            translateY(10px);
    }

    to{
        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }

}


/* =========================
   MAC BAR
========================= */

.modal-bar{
    height:45px;

    display:flex;

    align-items:center;

    padding:
        0
        16px;

    border-bottom:
        1px solid #eee;
}

.mac-dots{
    display:flex;

    gap:7px;
}

.mac-dots span{
    width:11px;
    height:11px;

    border-radius:50%;

    background:#ddd;
}

.modal-title{
    flex:1;

    text-align:center;

    font-size:13px;

    color:#8A9690;

    margin-right:45px;
}


/* =========================
   MODAL CONTENT
========================= */

.modal-content{
    padding:28px;
}

.modal-content h2{
    margin:0;

    color:#55766B;
}

.english{
    color:var(--muted);

    margin-top:6px;
}

.category-label{
    display:inline-block;

    margin-top:12px;

    padding:
        6px
        11px;

    background:
        var(--sage-soft);

    color:
        var(--sage-dark);

    border-radius:999px;

    font-size:12px;

    font-weight:700;
}


/* =========================
   VIDEO
========================= */

.sign-area{
    margin-top:22px;

    background:
        #F5F1E8;

    border-radius:20px;

    overflow:hidden;
}

.video-wrap{
    width:100%;

    aspect-ratio:16/9;

    position:relative;

    background:#EDE8DC;

    display:flex;

    align-items:center;
    justify-content:center;
}


/*
    ใช้ native controls ของ browser
    เพื่อให้ Safari แสดงปุ่มแบบเดียวกับภาพ
*/

#signVideo{
    width:100%;
    height:100%;

    object-fit:contain;

    background:#222;

    display:none;
}


/* =========================
   VIDEO PLACEHOLDER
========================= */

#videoPlaceholder{
    text-align:center;

    color:#929D97;

    padding:30px;
}


/* =========================
   CUSTOM VIDEO BUTTONS
   0.5x + LOOP
========================= */

.video-controls{
    display:none;

    gap:10px;

    flex-wrap:wrap;

    margin-top:12px;
}

.video-controls button{
    border:none;

    background:
        #E8F4EF;

    color:#527C6D;

    padding:
        10px
        15px;

    border-radius:999px;

    cursor:pointer;

    font-weight:700;

    transition:.2s ease;
}

.video-controls button:hover{
    transform:
        translateY(-2px);
}

.video-controls button.active{
    background:
        var(--sage);

    color:white;
}


/* =========================
   CLOSE
========================= */

.close-btn{
    width:100%;

    margin-top:20px;

    border:none;

    background:
        var(--sage);

    color:#fff;

    padding:13px;

    border-radius:15px;

    font-size:15px;

    font-weight:800;

    cursor:pointer;
}

.close-btn:hover{
    background:
        var(--sage-dark);
}


/* =========================
   FOOTER
========================= */

footer{
    text-align:center;

    padding:
        10px
        20px
        40px;

    color:#9AA49F;

    font-size:13px;

    line-height:1.7;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:850px){

    .vocab-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

}


@media(max-width:650px){

    .vocab-grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:12px;
    }

    .vocab-card{
        min-height:135px;

        padding:
            17px
            15px;
    }

    .modal-content{
        padding:20px;
    }

    .hero{
        padding-top:40px;
    }

}


@media(max-width:420px){

    .vocab-grid{
        grid-template-columns:
            1fr 1fr;
    }

    .category-btn{
        font-size:13px;

        padding:
            9px
            12px;
    }

}

</style>
</head>

<!-- =========================

<div

                </div>

            <!-- =========================

========================= -->

            <div

                id="videoControls"
            >

            <button

        </div>

    </div>

</div>

========================================================= */

let currentCategory = "all";

    document.getElementById(

    document.getElementById(

    );

const videoControls =
    document.getElementById(
        "videoControls"
    );

    document.getElementById(
        "slowBtn"
    );

const loopBtn =
    document.getElementById(
        "loopBtn"
    );



/* =========================================================
   GET VIDEO FILE
========================================================= */

function getVideoFile(item){
    return item.videoUrl || "";
}



/* =========================================================
   RENDER
========================================================= */

function render(){

    const filtered =
        vocabulary.filter(
            item => {

                const categoryMatch =
                    currentCategory === "all" ||
                    item.category === currentCategory;

                const searchMatch =
                    item.th
                        .toLowerCase()
                        .includes(
                            searchText
                        ) ||

                    item.en
                        .toLowerCase()
                        .includes(
                            searchText
                        );

                return (
                    categoryMatch &&
                    searchMatch
                );

            }
        );


    grid.innerHTML = "";


    if(
        !filtered.length
    ){

        grid.innerHTML = `
            <div class="empty">
                ไม่พบคำศัพท์ที่ค้นหา
            </div>
        `;

        return;
    }


    filtered.forEach(
        item => {

            const card =
                document.createElement(
                    "button"
                );

            card.className =
                "vocab-card";


            card.innerHTML = `

                <div class="vocab-icon">
                    ${item.icon}
                </div>

                <h3>
                    ${item.th}
                </h3>

                <p>
                    ${item.en}
                </p>

            `;


            card.addEventListener(
                "click",
                () => openModal(item)
            );


            grid.appendChild(card);

        }
    );

}



/* =========================================================
   OPEN MODAL
========================================================= */

function openModal(item){

    modalTitle.textContent =
        item.th;

    modalEnglish.textContent =
        item.en;

    modalMacTitle.textContent =
        item.th;

    modalCategory.textContent =
        categoryNames[
            item.category
        ] ||
        "คำศัพท์สุขภาพ";


    modal.classList.add(
        "show"
    );


    document.body.style.overflow =
        "hidden";


    showVideo(item);

}



/* =========================================================
   SHOW VIDEO
========================================================= */

function showVideo(item){

    const videoPath =
        getVideoFile(item);


    signVideo.pause();

    signVideo.removeAttribute(
        "src"
    );

    signVideo.load();


    signVideo.loop =
        loopMode;

    signVideo.playbackRate =
        slowMode
            ? 0.5
            : 1;


    if (!videoPath) {
        signVideo.style.display = "none";
        videoControls.style.display = "none";
        videoPlaceholder.style.display = "block";
        videoPlaceholder.innerHTML = `
            <div style="font-size:36px; margin-bottom:10px;">🎥</div>
            <div>ยังไม่มีวิดีโอสำหรับคำว่า <strong>${item.th}</strong></div>
        `;
        return;
    }


    videoPlaceholder.style.display =
        "none";

    videoControls.style.display =
        "flex";

    signVideo.style.display =
        "block";


    signVideo.src =
        videoPath;

    signVideo.load();


    signVideo.onloadeddata =
        () => {

            signVideo.playbackRate =
                slowMode
                    ? 0.5
                    : 1;

            signVideo.loop =
                loopMode;


            signVideo
                .play()
                .catch(
                    () => {}
                );

        };


    signVideo.onerror =
        () => {

            signVideo.pause();

            signVideo.style.display =
                "none";

            videoControls.style.display =
                "none";

            videoPlaceholder.style.display =
                "block";


            videoPlaceholder.innerHTML = `

                <div
                    style="
                        font-size:36px;
                        margin-bottom:10px;
                    "
                >
                    🎥
                </div>

                <div>
                    ยังไม่มีวิดีโอสำหรับคำว่า
                    <strong>
                        ${item.th}
                    </strong>
                </div>

            `;

        };

}



/* =========================================================
   SLOW 0.5X
========================================================= */

slowBtn.addEventListener(
    "click",
    () => {

        slowMode =
            !slowMode;


        signVideo.playbackRate =
            slowMode
                ? 0.5
                : 1;


        slowBtn.classList.toggle(
            "active",
            slowMode
        );


        slowBtn.textContent =
            slowMode
                ? "🐢 เล่นช้า 0.5×"
                : "▶ เล่นปกติ 1×";

    }
);



/* =========================================================
   LOOP
========================================================= */

loopBtn.addEventListener(
    "click",
    () => {

        loopMode =
            !loopMode;


        signVideo.loop =
            loopMode;


        loopBtn.classList.toggle(
            "active",
            loopMode
        );


        loopBtn.textContent =
            loopMode
                ? "🔁 เล่นซ้ำ: เปิด"
                : "🔁 เล่นซ้ำ";

    }
);



/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal(){

    modal.classList.remove(
        "show"
    );


    document.body.style.overflow =
        "" ;


    signVideo.pause();

    signVideo.removeAttribute(
        "src"
    );

    signVideo.load();

}



document
    .getElementById(
        "closeModal"
    )
    .addEventListener(
        "click",
        closeModal
    );



/* =========================================================
   CLICK OUTSIDE MODAL
========================================================= */

modal.addEventListener(
    "click",
    event => {

        if(
            event.target === modal
        ){

            closeModal();

        }

    }
);



/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

            closeModal();

        }

    }
);



/* =========================================================
   CATEGORY
========================================================= */

document
    .querySelectorAll(
        ".category-btn"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".category-btn"
                        )
                        .forEach(
                            btn => {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    currentCategory =
                        button.dataset.category;


                    render();

                }
            );

        }
    );



/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    event => {

        searchText =
            event.target.value
                .trim()
                .toLowerCase();


        render();

    }
);



/* =========================================================
   DEFAULT
========================================================= */

slowBtn.classList.add(
    "active"
);


render();

</script>
