<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>เกมภาษามือ · หมอเข้าใจ</title>
<link rel="stylesheet" href="style.css">

<style>
/* ================================
   MOR KHAO JAI — GAME UI
================================ */

.game-page{
    max-width: 850px !important;
    margin: 0 auto;
    padding-bottom: 60px;
}

.game-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:24px;
    gap:12px;
}

.game-back{
    text-decoration:none;
    color:#55766b;
    font-size:16px;
    font-weight:700;
}

.leaderboard-btn{
    text-decoration:none;
    background:#fff;
    color:#55766b;
    padding:11px 17px;
    border-radius:999px;
    font-size:15px;
    font-weight:800;
    box-shadow:0 8px 25px rgba(70,90,80,.08);
    transition:.2s ease;
}

.leaderboard-btn:hover{
    transform:translateY(-3px) scale(1.04);
}

/* INTRO */

.game-intro{
    text-align:center;
    padding:48px 32px !important;
    border-radius:32px !important;
}

.game-icon{
    width:86px;
    height:86px;
    margin:0 auto 22px;
    border-radius:28px;
    background:#dcefe7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    box-shadow:0 12px 30px rgba(80,120,105,.13);
    animation:floatGame 3s ease-in-out infinite;
}

@keyframes floatGame{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-7px) rotate(2deg)}
}

.game-intro h1{
    font-size:clamp(30px,5vw,44px);
    line-height:1.25;
    margin:0 0 14px;
}

.game-intro .intro-text{
    font-size:18px;
    line-height:1.8;
    color:#68756f;
    max-width:600px;
    margin:0 auto 28px;
}

.game-rules{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin:28px 0;
}

.rule{
    background:#f8faf8;
    border-radius:20px;
    padding:18px 12px;
}

.rule strong{
    display:block;
    font-size:23px;
    margin-bottom:5px;
}

.rule span{
    font-size:14px;
    color:#718078;
}

.name-label{
    display:block;
    text-align:left;
    font-size:16px;
    font-weight:800;
    margin:22px 0 8px;
}

#player{
    width:100%;
    box-sizing:border-box;
    font-size:18px !important;
    padding:16px 18px !important;
    border-radius:16px !important;
}

.start-btn{
    margin-top:18px;
    font-size:18px !important;
    padding:16px !important;
    border-radius:17px !important;
    cursor:pointer;
    transition:.2s ease;
}

.start-btn:hover{
    transform:translateY(-3px) scale(1.015);
}

/* QUIZ */

.quiz-card{
    padding:28px !important;
    border-radius:32px !important;
}

.quiz-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:18px;
}

.question-count{
    font-size:17px;
    font-weight:900;
    color:#55766b;
}

.streak{
    background:#fff3d8;
    color:#9a6d22;
    padding:9px 14px;
    border-radius:999px;
    font-size:15px;
    font-weight:900;
    transition:.25s ease;
}

.streak.hot{
    transform:scale(1.1);
}

.progress-wrap{
    width:100%;
    height:9px;
    background:#edf2ef;
    border-radius:99px;
    overflow:hidden;
    margin-bottom:25px;
}

.progress-bar{
    height:100%;
    width:20%;
    background:#63C0A4;
    border-radius:99px;
    transition:width .4s ease;
}

/* VIDEO */

.video-stage{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#eef5f1;
    border-radius:25px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:25px;
    box-shadow:inset 0 0 0 1px rgba(80,110,100,.06);
}

.video-stage video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.video-placeholder{
    text-align:center;
    padding:25px;
    color:#718078;
}

.video-placeholder .big-hand{
    font-size:58px;
    display:block;
    margin-bottom:10px;
    animation:handFloat 2.5s ease-in-out infinite;
}

@keyframes handFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

.video-placeholder strong{
    display:block;
    font-size:19px;
    color:#55766b;
    margin-bottom:5px;
}

.video-placeholder span{
    font-size:14px;
}

.replay-hint{
    position:absolute;
    top:14px;
    right:14px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(8px);
    padding:8px 12px;
    border-radius:999px;
    font-size:13px;
    font-weight:800;
    color:#55766b;
}

/* QUESTION */

.question-title{
    font-size:clamp(23px,4vw,31px);
    line-height:1.5;
    text-align:center;
    margin:5px auto 22px;
    max-width:680px;
}

/* ANSWERS */

.answers{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.answer-btn{
    position:relative;
    min-height:74px;
    padding:17px 20px;
    border:2px solid #e3ebe7;
    background:#fff;
    border-radius:20px;
    font-family:inherit;
    font-size:19px;
    font-weight:800;
    color:#44564f;
    cursor:pointer;
    transition:
        transform .18s ease,
        box-shadow .18s ease,
        border-color .18s ease,
        background .18s ease;
}

.answer-btn::after{
    content:"→";
    position:absolute;
    right:18px;
    opacity:0;
    transform:translateX(-7px);
    transition:.18s ease;
    color:#5e9d88;
}

.answer-btn:hover{
    transform:translateY(-6px) scale(1.035);
    border-color:#9bcdbc;
    box-shadow:0 15px 28px rgba(75,110,95,.13);
    background:#f8fcfa;
}

.answer-btn:hover::after{
    opacity:1;
    transform:translateX(0);
}

.answer-btn:active{
    transform:scale(.97);
}

.answer-btn.correct{
    background:#e3f4ec;
    border-color:#72b79e;
    color:#3d806b;
    animation:correctPop .45s ease;
}

.answer-btn.wrong{
    background:#fff0f0;
    border-color:#e5a4a4;
    color:#a25d5d;
    animation:wrongShake .4s ease;
}

@keyframes correctPop{
    0%{transform:scale(1)}
    50%{transform:scale(1.06)}
    100%{transform:scale(1)}
}

@keyframes wrongShake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-7px)}
    75%{transform:translateX(7px)}
}

/* FEEDBACK */

.feedback{
    min-height:27px;
    text-align:center;
    font-size:17px;
    font-weight:800;
    margin:17px 0 0;
}

.feedback.good{
    color:#4d927c;
}

.feedback.bad{
    color:#b56565;
}

/* RESULT */

.result-card{
    text-align:center;
    padding:42px 30px !important;
    border-radius:32px !important;
}

.result-icon{
    width:90px;
    height:90px;
    border-radius:30px;
    background:#e2f2eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:43px;
    margin:0 auto 20px;
}

.result-card h1{
    font-size:35px;
    line-height:1.35;
}

.score-circle{
    width:155px;
    height:155px;
    border-radius:50%;
    background:#f3f8f5;
    border:10px solid #d6ebe2;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    margin:25px auto;
}

.score-number{
    font-size:43px;
    line-height:1;
    font-weight:950;
    color:#55766b;
}

.score-label{
    margin-top:7px;
    font-size:14px;
    color:#7a8781;
}

.result-stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
    margin:25px 0;
}

.result-stat{
    background:#f8faf8;
    border-radius:19px;
    padding:17px 10px;
}

.result-stat strong{
    display:block;
    font-size:22px;
    color:#55766b;
    margin-bottom:4px;
}

.result-stat span{
    font-size:14px;
    color:#78857f;
}

.result-buttons{
    display:grid;
    gap:12px;
    margin-top:22px;
}

.result-buttons a,
.result-buttons button{
    min-height:55px;
    display:flex;
    justify-content:center;
    align-items:center;
    box-sizing:border-box;
    font-size:17px !important;
    border-radius:17px !important;
}

/* UTILITY */

.hidden{
    display:none !important;
}

@media(max-width:650px){
    .game-page{
        padding-left:14px;
        padding-right:14px;
    }

    .game-intro,
    .quiz-card,
    .result-card{
        padding:25px 18px !important;
    }

    .game-rules{
        grid-template-columns:1fr;
    }

    .answers{
        grid-template-columns:1fr;
    }

    .answer-btn{
        min-height:68px;
        font-size:18px;
    }

    .quiz-top{
        align-items:flex-start;
    }

    .question-title{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="page-shell game-page">

    <div class="game-top">
        <a href="index.html" class="game-back">← กลับหน้าหลัก</a>
        <a href="leaderboard.html" class="leaderboard-btn">🏆 จัดอันดับ</a>
    </div>

    <!-- INTRO -->
    <section id="intro" class="form-card game-intro">

        <div class="game-icon">🤟</div>

        <p class="eyebrow">SIGN LANGUAGE GAME</p>

        <h1>จับมือให้ถูก<br>แล้วไปต่อ!</h1>

        <p class="intro-text">
            ดูวิดีโอภาษามือ แล้วเลือกความหมายที่คิดว่าถูกที่สุด
        </p>

        <div class="game-rules">
            <div class="rule">
                <strong>5</strong>
                <span>คำถาม</span>
            </div>

            <div class="rule">
                <strong>🔥</strong>
                <span>สะสม Streak</span>
            </div>

            <div class="rule">
                <strong>🏆</strong>
                <span>เก็บคะแนน</span>
            </div>
        </div>

        <label class="name-label" for="player">
            ชื่อที่ต้องการให้เรียก
        </label>

        <input
            id="player"
            maxlength="24"
            autocomplete="off"
            placeholder="เช่น มี่"
        >

        <p id="gameError" class="error"></p>

        <button
            type="button"
            class="primary full start-btn"
            onclick="startGame()"
        >
            เริ่มเกม →
        </button>

    </section>


    <!-- QUIZ -->
    <section id="quiz" class="form-card quiz-card hidden">

        <div class="quiz-top">
            <div id="qnum" class="question-count">
                ข้อ 1 / 5
            </div>

            <div id="streak" class="streak">
                🔥 Streak 0
            </div>
        </div>

        <div class="progress-wrap">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="video-stage">

            <video
                id="signVideo"
                controls
                playsinline
                preload="metadata"
            ></video>

            <div id="videoPlaceholder" class="video-placeholder">
                <span class="big-hand">🤟</span>
                <strong>วิดีโอภาษามือ</strong>
                <span>เมื่อใส่วิดีโอแล้ว กด ▶ เพื่อดูท่าทาง</span>
            </div>

            <div class="replay-hint">
                ↻ ดูซ้ำได้
            </div>

        </div>

        <h2 class="question-title">
            ท่าทางในวิดีโอนี้หมายถึงอะไร?
        </h2>

        <div id="answers" class="answers"></div>

        <p id="feedback" class="feedback"></p>

    </section>


    <!-- RESULT -->
    <section id="result" class="form-card result-card hidden"></section>

</div>

<script src="game.js"></script>
<script src="language.js"></script>

<script src="mkj-navigation.js"></script>
</body>
</html>
