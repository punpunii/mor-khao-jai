<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>กระดานจัดอันดับ · หมอเข้าใจ</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================
   MOR KHAO JAI — LEADERBOARD
===================================== */

.leader-page{
    max-width:850px !important;
    margin:0 auto;
    padding-bottom:70px;
}

/* TOP */

.leader-top{
    display:flex;
    align-items:center;
    margin-bottom:25px;
}

.back-link{
    text-decoration:none;
    color:#55766b;
    font-size:17px;
    font-weight:800;
}

/* HERO */

.leader-hero{
    text-align:center;
    padding:42px 25px 34px !important;
    border-radius:34px !important;
    overflow:hidden;
    position:relative;
}

.leader-hero::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:#e5f2ec;
    top:-90px;
    left:-60px;
    opacity:.7;
}

.leader-hero::after{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    border-radius:50%;
    background:#f7eddc;
    bottom:-80px;
    right:-45px;
    opacity:.7;
}

.trophy{
    position:relative;
    z-index:2;
    width:92px;
    height:92px;
    margin:0 auto 18px;
    border-radius:31px;
    background:#fff8e9;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
    box-shadow:0 15px 35px rgba(100,90,60,.12);
}

.leader-hero h1{
    position:relative;
    z-index:2;
    font-size:clamp(31px,6vw,46px);
    line-height:1.25;
    margin:0 0 10px;
}

.leader-hero p{
    position:relative;
    z-index:2;
    font-size:17px;
    line-height:1.7;
    color:#748079;
    margin:0;
}

/* STATS */

.leader-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:13px;
    margin:18px 0 25px;
}

.leader-stat{
    background:#fff;
    border:1px solid #E6EFED;
    border-radius:22px;
    padding:20px 10px;
    text-align:center;
    box-shadow:0 9px 25px rgba(70,90,80,.06);
}

.leader-stat-icon{
    font-size:27px;
    margin-bottom:5px;
}

.leader-stat strong{
    display:block;
    font-size:24px;
    color:#55766b;
    line-height:1.2;
}

.leader-stat span{
    display:block;
    margin-top:5px;
    font-size:14px;
    color:#87918c;
}

/* BOARD */

.board{
    padding:27px !important;
    border-radius:30px !important;
}

.board-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.board-heading h2{
    margin:0;
    font-size:25px;
}

.board-heading span{
    font-size:14px;
    color:#8a958f;
}

/* PODIUM */

.podium{
    display:grid;
    grid-template-columns:1fr 1.15fr 1fr;
    align-items:end;
    gap:12px;
    margin-bottom:27px;
}

.podium-card{
    position:relative;
    text-align:center;
    border-radius:25px;
    padding:22px 10px 20px;
    background:#f7faf8;
    border:2px solid transparent;
}

.podium-card.first{
    background:#fff8e7;
    border-color:#ead49a;
    padding-top:29px;
}

.podium-card.second{
    background:#f5f7f6;
    border-color:#dce3df;
}

.podium-card.third{
    background:#faf4ed;
    border-color:#e8d7c4;
}

.crown{
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    font-size:30px;
}

.rank-medal{
    font-size:35px;
    margin-bottom:7px;
}

.podium-name{
    font-size:18px;
    font-weight:950;
    color:#4d625a;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.podium-score{
    margin-top:6px;
    font-size:27px;
    font-weight:950;
    color:#55766b;
}

.podium-score small{
    font-size:13px;
    font-weight:800;
    color:#89938e;
}

/* LIST */

.rank-list{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.rank-row{
    display:grid;
    grid-template-columns:54px 1fr auto;
    align-items:center;
    gap:14px;
    min-height:76px;
    padding:12px 16px;
    background:#F3F9F8;
    border:1px solid #e9efec;
    border-radius:20px;
}

.rank-number{
    width:46px;
    height:46px;
    border-radius:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#e9f1ed;
    color:#5d746b;
    font-size:18px;
    font-weight:950;
}

.rank-info{
    min-width:0;
}

.rank-name{
    font-size:18px;
    font-weight:900;
    color:#4c5f57;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.rank-detail{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:5px;
}

.rank-detail span{
    font-size:13px;
    color:#7d8983;
}

.rank-score{
    text-align:right;
}

.rank-score strong{
    display:block;
    font-size:24px;
    color:#55766b;
    line-height:1.1;
}

.rank-score span{
    font-size:12px;
    color:#89938e;
}

/* EMPTY */

.empty-board{
    text-align:center;
    padding:40px 20px;
    color:#7c8882;
}

.empty-icon{
    font-size:52px;
    margin-bottom:12px;
}

.empty-board h3{
    margin:0 0 8px;
    font-size:22px;
    color:#55766b;
}

.empty-board p{
    font-size:16px;
    line-height:1.7;
    margin:0;
}

/* BUTTON */

.bottom-actions{
    margin-top:20px;
    display:grid;
    gap:12px;
}

.bottom-actions a{
    min-height:58px;
    display:flex;
    align-items:center;
    justify-content:center;
    box-sizing:border-box;
    text-decoration:none;
    font-size:18px !important;
    font-weight:900;
    border-radius:18px !important;
}

/* MOBILE */

@media(max-width:650px){

    .leader-page{
        padding-left:14px;
        padding-right:14px;
    }

    .leader-hero{
        padding:35px 18px 29px !important;
    }

    .leader-stats{
        gap:9px;
    }

    .leader-stat{
        padding:16px 7px;
    }

    .leader-stat strong{
        font-size:20px;
    }

    .leader-stat span{
        font-size:12px;
    }

    .board{
        padding:18px !important;
    }

    .podium{
        gap:7px;
    }

    .podium-card{
        padding:17px 6px;
        border-radius:19px;
    }

    .podium-card.first{
        padding-top:24px;
    }

    .podium-name{
        font-size:14px;
    }

    .podium-score{
        font-size:22px;
    }

    .rank-row{
        grid-template-columns:45px 1fr auto;
        gap:10px;
        padding:10px;
    }

    .rank-number{
        width:40px;
        height:40px;
        border-radius:13px;
    }

    .rank-name{
        font-size:16px;
    }

    .rank-score strong{
        font-size:20px;
    }
}

</style>
</head>


<body>

<div class="page-shell leader-page">

    <!-- TOP -->

    <div class="leader-top">

        <a href="game.html" class="back-link">
            ← กลับเกม
        </a>

    </div>


    <!-- HERO -->

    <section class="form-card leader-hero">

        <div class="trophy">
            🏆
        </div>

        <p class="eyebrow">
            SIGN LANGUAGE GAME
        </p>

        <h1>
            Hall of Fame
        </h1>

        <p>
            ใครจะเป็นเซียนภาษามืออันดับหนึ่ง?
        </p>

    </section>


    <!-- STATS -->

    <div class="leader-stats">

        <div class="leader-stat">

            <div class="leader-stat-icon">
                👑
            </div>

            <strong id="totalPlayers">
                0
            </strong>

            <span>
                ผู้เล่น
            </span>

        </div>


        <div class="leader-stat">

            <div class="leader-stat-icon">
                🎯
            </div>

            <strong id="bestScore">
                0
            </strong>

            <span>
                คะแนนสูงสุด
            </span>

        </div>


        <div class="leader-stat">

            <div class="leader-stat-icon">
                ⚡
            </div>

            <strong id="bestTime">
                --:--
            </strong>

            <span>
                เวลาที่ดีที่สุด
            </span>

        </div>

    </div>


    <!-- BOARD -->

    <section class="form-card board">

        <div class="board-heading">

            <h2>
                🏆 อันดับทั้งหมด
            </h2>

            <span>
                Top Players
            </span>

        </div>


        <div id="podium" class="podium"></div>


        <div id="rankList" class="rank-list"></div>


        <div id="emptyBoard" class="empty-board" style="display:none;">

            <div class="empty-icon">
                🌱
            </div>

            <h3>
                ยังไม่มีใครขึ้นกระดาน
            </h3>

            <p>
                เล่นเกมรอบแรกของคุณ<br>
                แล้วมาเป็นคนเปิดตารางเลย!
            </p>

        </div>

    </section>


    <!-- BUTTON -->

    <div class="bottom-actions">

        <a href="game.html" class="primary">
            🎮 เล่นเกมอีกครั้ง
        </a>

        <a href="index.html" class="secondary">
            ← กลับหน้าหลัก
        </a>

    </div>

</div>


<script>

const RANKING_API =
"https://script.google.com/macros/s/AKfycbxTB-EwExcTnCWd0kq_ohEaaRdR35t--RkY5cfD42Nx9wdQtCuq90HraHnp6Az0pMR21A/exec";


const podium =
document.getElementById("podium");

const rankList =
document.getElementById("rankList");

const emptyBoard =
document.getElementById("emptyBoard");

const totalPlayers =
document.getElementById("totalPlayers");

const bestScore =
document.getElementById("bestScore");

const bestTime =
document.getElementById("bestTime");


/* =====================================
   LOAD GLOBAL RANKING
===================================== */

function loadRanking(){

    const callbackName =
    "mkjLeaderboardCallback_" + Date.now();


    window[callbackName] =
    function(data){

        console.log(
            "MOR KHAO JAI RANKING:",
            data
        );


        if(
            !data ||
            !data.success ||
            !Array.isArray(data.rankings)
        ){

            showEmpty();

            return;

        }


        const scores =
        data.rankings
        .filter(item => item && item.name)
        .map(item => ({

            name:
            String(item.name),

            score:
            Number(item.score || 0),

            total:
            Number(item.total || 5),

            time:
            Number(item.time || 0)

        }));


        scores.sort(
            function(a,b){

                if(
                    b.score !== a.score
                ){

                    return b.score - a.score;

                }

                return a.time - b.time;

            }
        );


        renderRanking(scores);


        delete window[callbackName];

        script.remove();

    };


    const script =
    document.createElement("script");


    script.src =
    RANKING_API
    +
    "?callback="
    +
    callbackName
    +
    "&_="
    +
    Date.now();


    script.onerror =
    function(){

        console.error(
            "ไม่สามารถโหลด Ranking API ได้"
        );

        showEmpty();

        delete window[callbackName];

    };


    document.body.appendChild(script);

}


/* =====================================
   RENDER
===================================== */

function renderRanking(scores){

    podium.innerHTML = "";

    rankList.innerHTML = "";


    if(!scores.length){

        showEmpty();

        return;

    }


    emptyBoard.style.display =
    "none";


    podium.style.display =
    "grid";


    rankList.style.display =
    "flex";


    /* STATS */

    totalPlayers.textContent =
    scores.length;


    bestScore.textContent =
    scores[0].score
    +
    "/"
    +
    scores[0].total;


    const validTimes =
    scores
    .map(item => item.time)
    .filter(time => time > 0);


    if(validTimes.length){

        bestTime.textContent =
        formatTime(
            Math.min(...validTimes)
        );

    }


    /* TOP 3 */

    const top3 =
    scores.slice(0,3);


    const medals =
    ["🥇","🥈","🥉"];


    const classes =
    ["first","second","third"];


    const order =
    [1,0,2];


    order.forEach(
    function(index){

        if(!top3[index]){
            return;
        }


        const item =
        top3[index];


        const card =
        document.createElement("div");


        card.className =
        "podium-card "
        +
        classes[index];


        card.innerHTML = `

            ${
                index === 0
                ?
                '<div class="crown">👑</div>'
                :
                ''
            }

            <div class="rank-medal">
                ${medals[index]}
            </div>

            <div class="podium-name">
                ${escapeHtml(item.name)}
            </div>

            <div class="podium-score">
                ${item.score}
                <small>
                    / ${item.total}
                </small>
            </div>

        `;


        podium.appendChild(card);

    });


    /* RANK LIST */

    scores
    .slice(3)
    .forEach(
    function(item,index){

        const actualRank =
        index + 4;


        const row =
        document.createElement("div");


        row.className =
        "rank-row";


        row.innerHTML = `

            <div class="rank-number">
                #${actualRank}
            </div>

            <div class="rank-info">

                <div class="rank-name">
                    ${escapeHtml(item.name)}
                </div>

                <div class="rank-detail">

                    <span>
                        ⏱ ${formatTime(item.time)}
                    </span>

                </div>

            </div>

            <div class="rank-score">

                <strong>
                    ${item.score}/${item.total}
                </strong>

                <span>
                    คะแนน
                </span>

            </div>

        `;


        rankList.appendChild(row);

    });

}


/* =====================================
   EMPTY
===================================== */

function showEmpty(){

    podium.innerHTML = "";

    rankList.innerHTML = "";


    podium.style.display =
    "none";


    rankList.style.display =
    "none";


    emptyBoard.style.display =
    "block";


    totalPlayers.textContent =
    "0";


    bestScore.textContent =
    "0";


    bestTime.textContent =
    "--:--";

}


/* =====================================
   TIME
===================================== */

function formatTime(seconds){

    seconds =
    Number(seconds || 0);


    const min =
    Math.floor(seconds / 60);


    const sec =
    seconds % 60;


    return (
        String(min).padStart(2,"0")
        +
        ":"
        +
        String(sec).padStart(2,"0")
    );

}


/* =====================================
   SAFE HTML
===================================== */

function escapeHtml(text){

    return String(text).replace(
        /[&<>"']/g,

        function(char){

            return {

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            }[char];

        }
    );

}


/* =====================================
   START
===================================== */

loadRanking();

</script>


<script src="mkj-navigation.js"></script>

</body>
</html>
